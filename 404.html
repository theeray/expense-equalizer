<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020806">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expense Equalizer">
  <meta name="description" content="Eric's Expense Equalizer — Share. Split. Simple.">
  <link rel="manifest" href="./manifest.webmanifest?v=24">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=24">
  <link rel="icon" href="./favicon.png?v=24">
  <title>Eric's Expense Equalizer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#020806;overflow:hidden}
    *{box-sizing:border-box}
    .start-link{
      position:fixed;inset:0;display:block;background:#020806;
      text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
    }
    .start-picture{position:absolute;inset:0;display:block;width:100%;height:100%}
    .start-image{
      position:absolute;inset:0;width:100%;height:100%;display:block;
      object-fit:cover;object-position:center center;background:#020806;
      user-select:none;-webkit-user-drag:none;
    }
    @media (min-width:651px){
      .start-link{background:#020806}
      .start-picture{left:50%;transform:translateX(-50%);width:min(100vw,540px);right:auto}
    }
  </style>
</head>
<body>
  <a class="start-link" href="./app.html?v=24" aria-label="Get Started with Eric's Expense Equalizer">
    <picture class="start-picture">
      <source srcset="./splash-art-hidpi.png?v=24" media="(min-resolution:1.5dppx)">
      <img class="start-image" src="./splash-art-original.jpg?v=24"
           alt="Eric's Expense Equalizer. Share. Split. Simple. Get Started." draggable="false">
    </picture>
  </a>
</body>
</html>
